<style>
/* ═══════ 송쌤과학 중1 가상실험실 공통 껍데기 (체험버전 V2.11) ═══════
   ① 테마와 무관한 토큰 → ② 테마 토큰(두 블록, 같은 목록) → ③ 마감 기본층 → ④ 껍데기 부품
   실험실마다 달라지는 장면 토큰·배치는 각 실험실 src/app.css에 둔다. */
:root{
  --font-ui:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-title:var(--font-ui);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  --r-1:6px;--r-2:10px;--r-3:16px;--r-full:999px;        /* 작은 컨트롤 6 · 버튼·입력 10 · 패널·장면 16 · 상태 알약 full */
  --control-h:36px;--icon-size:18px;
  --dur-fast:140ms;--dur-ui:260ms;--dur-ui-out:180ms;--dur-layout:360ms;
  --ease-out:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.4,0,1,1);--lift:8px;
  --top-h:56px;--strip-h:0px;
  --light-angle:215deg;                                   /* 주 광원: 왼쪽 위 — UI 그림자는 오른쪽 아래로 */
  --brand-pink:#FFB7B2;--brand-ink:#3b1d1b;
  --yt-red:#ff0033;--yt-play:#ffffff;--ig-1:#feda75;--ig-2:#fa7e1e;--ig-3:#d62976;--ig-4:#4f5bd5;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0b131d;--surface-1:#101b28;--surface-2:#182636;
  --stage:#0e1a27;--stage-2:#132233;
  --text-1:#e8eff5;--text-2:#b0c0cf;--text-3:#8ea2b4;--line-1:#223445;--line-2:#34495d;
  --accent:#6fd3c1;--accent-strong:#9be7d9;--accent-soft:#163a3b;--on-accent:#08131c;--focus:#9be7d9;--scrim:#02070dcc;
  --danger:#ff9d8a;--danger-soft:#3b2322;--ok:#7ed7a0;--ok-soft:#1d3b32;--warn:#ffcf5c;--warn-soft:#3f3822;
  --data-1:#E69F00;--data-2:#56B4E9;--data-3:#2fbf92;--data-4:#CC79A7;
  --shadow-color:215 45% 3%;
  --shadow-1:0 0 #0000;
  --shadow-2:0 12px 32px -12px hsl(var(--shadow-color) / .6);
  --shadow-3:0 24px 64px -16px hsl(var(--shadow-color) / .7);
  --edge-hi:inset 0 1px 0 hsl(0 0% 100% / .06);
}
:root[data-theme="light"]{
  color-scheme:light;
  --surface-0:#edf1f4;--surface-1:#fbfcfd;--surface-2:#e3eaf0;
  --stage:#f5f8fa;--stage-2:#e9eff4;
  --text-1:#132a3b;--text-2:#44596b;--text-3:#566b7e;--line-1:#d3dde5;--line-2:#b2c3d0;
  --accent:#0f6b60;--accent-strong:#0a5148;--accent-soft:#d5eeea;--on-accent:#ffffff;--focus:#0a5148;--scrim:#0b1a2680;
  --danger:#b3261e;--danger-soft:#fbe3df;--ok:#1d7a47;--ok-soft:#d8f0e2;--warn:#8a5a00;--warn-soft:#fff2c8;
  --data-1:#B07400;--data-2:#0072B2;--data-3:#007A5A;--data-4:#A6508A;
  --shadow-color:210 30% 22%;
  --shadow-1:0 1px 2px hsl(var(--shadow-color) / .08);
  --shadow-2:0 1px 2px hsl(var(--shadow-color) / .06),0 10px 28px -10px hsl(var(--shadow-color) / .22);
  --shadow-3:0 2px 6px hsl(var(--shadow-color) / .08),0 24px 56px -16px hsl(var(--shadow-color) / .30);
  --edge-hi:0 0 #0000;
}
/* ③ 마감 기본층 (§6.8) */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;accent-color:var(--accent)}
body{margin:0;background:var(--surface-0);color:var(--text-1);font:400 15px/1.65 var(--font-ui);font-synthesis:none;word-break:keep-all;overflow-wrap:break-word}
:root[data-theme="dark"] body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p,li,figcaption{text-wrap:pretty}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1em)}
button,a,[role="button"]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklab,var(--accent) 30%,transparent)}
input,textarea{caret-color:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.scroll{overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.num{font-variant-numeric:tabular-nums}
.unit{white-space:nowrap}
img,canvas,video{display:block;max-width:100%}
[hidden]{display:none!important}
dialog:not([open]){display:none}
[popover]:not(:popover-open){display:none}
.sr-only{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:90;padding:8px 12px;border-radius:var(--r-1);background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600}
.skip:focus{top:8px}
kbd{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--text-1);background:var(--surface-0)}
svg.ic{width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--text-2)}
/* ⑤ 사용자 설정 존중 */
@media (prefers-reduced-motion:reduce){:root{--lift:0px}}
@media (prefers-contrast:more){:root[data-theme]{--line-1:var(--line-2);--text-3:var(--text-2)}}
@media (prefers-reduced-transparency:reduce){.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surface-1)!important}}

/* ═══ 몸체: 상단 막대 / 본문 / (휴대폰) 브랜드 띠 ═══ */
html,body{height:100%}
body{height:100dvh;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr) var(--strip-h);overflow:hidden}
.topbar{position:relative;z-index:30;display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;background:var(--surface-1);border-bottom:1px solid var(--line-1);min-width:0}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brandmark{width:27px;height:27px;border-radius:var(--r-2);background:var(--brand-pink);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brandmark svg.ic{width:17px;height:17px;stroke-width:2}
.word{font:700 13px/1 var(--font-ui);color:var(--text-1)}
.vdiv{width:1px;height:15px;background:var(--line-2);flex:none}
.social{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-1);color:var(--text-2);text-decoration:none;flex:none}
.social::before{content:'';position:absolute;inset:-5px}
.social svg{width:21px;height:21px}
.social .yt-body{fill:currentColor}.social .yt-play{fill:var(--surface-1)}
.social .ig-line{fill:none;stroke:currentColor;stroke-width:2}.social .ig-dot{fill:currentColor}
.social:is(:hover,:focus-visible) .yt-body{fill:var(--yt-red)}.social:is(:hover,:focus-visible) .yt-play{fill:var(--yt-play)}
.social:is(:hover,:focus-visible) .ig-line{stroke:url(#ig-grad)}.social:is(:hover,:focus-visible) .ig-dot{fill:var(--ig-3)}
.top-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 auto}
.top-title h1{font:700 15px/1.2 var(--font-ui);color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top-title .std{font:500 12px/1 var(--font-ui);color:var(--text-2);white-space:nowrap}
.utilities{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.hsep{width:1px;height:20px;background:var(--line-1);margin:0 4px}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:var(--r-2);background:transparent;color:var(--text-2);cursor:pointer;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.icon-btn::before{content:'';position:absolute;inset:-4px}
.icon-btn svg.ic{width:20px;height:20px}
.icon-btn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover,.social:hover{background:var(--surface-2);color:var(--text-1)}}
main.app{position:relative;min-width:0;min-height:0;overflow:hidden;outline:none}

/* ═══ 버튼 계층: Primary / Secondary / Ghost / Icon ═══ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--control-h);padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-2);background:var(--surface-1);color:var(--text-1);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur-fast)}
.btn::before{content:'';position:absolute;inset:-4px 0}
.btn svg.ic{width:17px;height:17px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn.wide{width:100%}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn:not(.primary):not(:disabled):hover{background:var(--surface-2)}
  .btn.primary:not(:disabled):hover{background:var(--accent-strong);border-color:var(--accent-strong)}
  .btn.ghost:hover{color:var(--text-1)}
}
/* 칩 · 세그먼트 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-full);background:transparent;color:var(--text-1);font:500 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.chip::before{content:'';position:absolute;inset:-6px -2px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text-1);font-weight:700}
.chip[aria-pressed="true"]::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);order:-1}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--line-1)}
.seg button{position:relative;min-height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button::before{content:'';position:absolute;inset:-6px -1px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface-1);color:var(--text-1);font-weight:800;box-shadow:var(--edge-hi),0 1px 2px hsl(var(--shadow-color) / .18)}
@media (hover:hover) and (pointer:fine){.chip:hover{border-color:var(--text-2)}.seg button:not([aria-pressed="true"]):not([aria-selected="true"]):hover{color:var(--text-1)}}

/* 결과 저장 — 장면 모서리의 카메라 (Ghost/Icon 계층) */
.save-btn{position:relative;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 9px;border:1px solid var(--line-2);border-radius:var(--r-2);background:color-mix(in oklab,var(--surface-1) 88%,transparent);color:var(--text-1);font:600 13px/1 var(--font-ui);cursor:pointer;white-space:nowrap;box-shadow:var(--edge-hi)}
.save-btn::before{content:'';position:absolute;inset:-5px}
.save-btn svg.ic{width:18px;height:18px}
.save-btn[aria-busy="true"]{opacity:.6;cursor:progress}
@media (hover:hover) and (pointer:fine){.save-btn:hover{background:var(--surface-2)}}
.shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:shutter .32s var(--ease-out);z-index:5;border-radius:inherit}
@keyframes shutter{0%{opacity:.55}100%{opacity:0}}

/* 판독값 — 라벨 · 큰 수 · 작은 단위 */
.readout{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.readout .v{font:800 26px/1.05 var(--font-ui);letter-spacing:-.02em;color:var(--text-1)}
.readout .u{font:600 13px/1 var(--font-ui);color:var(--text-2)}
.lbl{font:600 12px/1.4 var(--font-ui);color:var(--text-2)}

/* 슬라이더 (네이티브 range + accent-color, 트랙 4px 이상 · 터치 44px) */
input[type="range"]{width:100%;height:44px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y}

/* ═══ 대화상자 · 드로어 · 토스트 ═══ */
dialog{border:0;padding:0;color:var(--text-1);background:var(--surface-1)}
dialog::backdrop{background:var(--scrim)}
.modal{width:min(620px,calc(100vw - 32px));max-height:min(86dvh,760px);border-radius:var(--r-3);box-shadow:var(--edge-hi),var(--shadow-3)}
.modal[open]{display:flex;flex-direction:column}
.modal.narrow{width:min(420px,calc(100vw - 32px))}
.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:clamp(360px,32vw,460px);border-left:1px solid var(--line-1);box-shadow:var(--shadow-3)}
.drawer[open]{display:flex;flex-direction:column}
.drawer::backdrop{background:color-mix(in oklab,var(--scrim) 55%,transparent)}
.dialog-head{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 20px;border-bottom:1px solid var(--line-1);flex:none}
.dialog-head h2{font:800 18px/1.3 var(--font-ui);margin-right:auto}
.dialog-body{padding:16px 20px 22px;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
:is(dialog,[popover]).sheet{opacity:0;transform:translateY(var(--lift));transition:opacity var(--dur-ui-out) var(--ease-in),transform var(--dur-ui-out) var(--ease-in),overlay var(--dur-ui-out) allow-discrete,display var(--dur-ui-out) allow-discrete}
:is(dialog[open],[popover]:popover-open).sheet{opacity:1;transform:none;transition-duration:var(--dur-ui);transition-timing-function:var(--ease-out)}
@starting-style{:is(dialog[open],[popover]:popover-open).sheet{opacity:0;transform:translateY(var(--lift))}}
.drawer.sheet{transform:translateX(24px)}
.drawer.sheet[open]{transform:none}
@starting-style{.drawer.sheet[open]{transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){.drawer.sheet,.drawer.sheet[open]{transform:none}}
.help-doc h3{font:700 15px/1.4 var(--font-ui);margin:18px 0 6px;color:var(--text-1)}
.help-doc h3:first-child{margin-top:0}
.help-doc p,.help-doc li{font-size:15px;line-height:1.7;color:var(--text-1)}
.help-doc ul,.help-doc ol{margin:0;padding-left:20px}
.help-doc li+li{margin-top:4px}
.help-doc .keys{line-height:2.2}
.brandblock{margin-top:16px;padding:12px 14px;border-radius:var(--r-2);background:var(--surface-2);font-size:13px;line-height:1.8;color:var(--text-1)}
.brandblock a{color:var(--text-1)}
.ver-line{margin-top:10px;font:500 12px/1 var(--font-ui);color:var(--text-2)}
/* 원리 카드 */
.tcard{padding:0 0 18px;border-bottom:1px solid var(--line-1);margin-bottom:18px}
.tcard:last-child{border-bottom:0;margin-bottom:0}
.tcard h3{font:800 18px/1.35 var(--font-ui);margin:0 0 8px}
.tcard figure{margin:0 0 10px;border-radius:var(--r-2);background:var(--stage);border:1px solid var(--line-1);overflow:hidden}
.tcard figure svg{display:block;width:100%;height:auto}
.tcard .def{font:700 15px/1.6 var(--font-ui);margin-bottom:6px}
.tcard p{font-size:15px;line-height:1.7;color:var(--text-1)}
.tcard p+p{margin-top:6px}
.tcard .link{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-1) var(--r-1) 0;font-size:15px;line-height:1.65}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--strip-h) + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;max-width:min(360px,calc(100vw - 24px));padding:10px 14px;border-radius:var(--r-2);background:var(--surface-1);border:1px solid var(--line-2);box-shadow:var(--edge-hi),var(--shadow-2);font:500 13px/1.5 var(--font-ui);color:var(--text-1)}
.toast.error{border-color:var(--danger)}
.toast .toast-x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:var(--r-1);background:transparent;color:var(--text-2);cursor:pointer}
.textlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-1);font:600 13px/1 var(--font-ui);text-decoration:underline;text-underline-offset:3px;padding:10px 0}
.textlink .yt-ic{width:20px;height:20px;stroke:none}
.textlink .yt-ic .yt-body{fill:var(--yt-red)}.textlink .yt-ic .yt-play{fill:#fff}

/* ═══ 휴대폰 세로(≤600px): 브랜드·채널은 아래 브랜드 띠로, 위에는 제목 + 고정 세트 ═══ */
@media (max-width:600px){
  :root{--top-h:52px;--strip-h:40px}
  .topbar{padding:0 4px 0 12px;gap:6px}
  .topbar>.vdiv{display:none}
  .top-title .std{display:none}
  .top-title h1{font-size:15px}
  .brand{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--strip-h) + env(safe-area-inset-bottom));padding:0 12px env(safe-area-inset-bottom);background:var(--surface-1);border-top:1px solid var(--line-1);justify-content:flex-start}
  .brand .social{width:44px;height:36px}
  .brand .social svg{width:18px;height:18px}
  .utilities .hsep{margin:0 2px}
  .icon-btn{width:40px;height:40px}

/* ═══════ 이 실험실 ═══════ */
/* 용수철 탄성력 실험 — 세로로 긴 실험대(왼쪽) + 넓은 측정·기록 칸(오른쪽: 계기 → 기록표 | 그래프) */
:root[data-theme="dark"]{
  --force:#ff7b5c;--force-2:#6ec7ff;--read:#ff5d73;
  --bench:#1d2632;--bench-edge:#2f3b4c;
  --rod-hi:#9aa5b1;--rod-lo:#3b4450;--base-hi:#3a4452;--base-lo:#1f252e;--boss:#56606b;--boss-hi:#8d98a5;
  --spring-front:#d5dde6;--spring-back:#6f7c8a;
  --brass-hi:#f3dc8a;--brass:#c9a227;--brass-lo:#7a5c10;--hookc:#b8c2cc;
  --ruler:#e9e1c8;--ruler-edge:#9c9272;--ruler-ink:#1b1a14;
  --tray:#2a3542;--tray-edge:#435266;--loupe-ring:#b0c0cf;--loupe-bg:#0e1a27;
  --data-a:#E69F00;--data-b:#56B4E9;
}
:root[data-theme="light"]{
  --force:#cf3a1c;--force-2:#0067a6;--read:#c8243a;
  --bench:#dde4ea;--bench-edge:#b2c3d0;
  --rod-hi:#f4f7fa;--rod-lo:#5f6a76;--base-hi:#6f7a87;--base-lo:#3b4450;--boss:#5f6a76;--boss-hi:#9aa5b1;
  --spring-front:#5a6572;--spring-back:#a9b4bf;
  --brass-hi:#f6e3a0;--brass:#c49a1e;--brass-lo:#80600e;--hookc:#6f7a87;
  --ruler:#fffbe9;--ruler-edge:#b9ae94;--ruler-ink:#23262d;
  --tray:#c7d1da;--tray-edge:#8a9aab;--loupe-ring:#44596b;--loupe-bg:#f5f8fa;
  --data-a:#B07400;--data-b:#0072B2;
}
.lab{height:100%;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr)}
.stage-wrap{position:relative;min-height:0;background:var(--stage);border-right:1px solid var(--line-1)}
.stage{position:absolute;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none;touch-action:none}
.stage-tools{position:absolute;top:12px;left:12px;z-index:3}

/* 장면 */
.bench{fill:var(--bench)}.bench-edge{fill:var(--bench-edge)}
.rod-lo-s{stop-color:var(--rod-lo)}.rod-hi-s{stop-color:var(--rod-hi)}
.base-hi-s{stop-color:var(--base-hi)}.base-lo-s{stop-color:var(--base-lo)}
.rod{fill:url(#rodGrad)}
.base{fill:url(#baseGrad)}
.boss{fill:var(--boss);stroke:var(--rod-lo);stroke-width:.6}
.boss-hi{fill:var(--boss-hi)}
.arm{fill:url(#rodGrad)}
.knob{fill:var(--boss-hi);stroke:var(--rod-lo);stroke-width:.5}
.sp-back{fill:none;stroke:var(--spring-back);stroke-linecap:round}
.sp-front{fill:none;stroke:var(--spring-front);stroke-linecap:round}
.hook{fill:none;stroke:var(--hookc);stroke-width:1.4;stroke-linecap:round}
.brass-hi-s{stop-color:var(--brass-hi)}.brass-s{stop-color:var(--brass)}.brass-lo-s{stop-color:var(--brass-lo)}
.w-body{fill:url(#brassGrad);stroke:var(--brass-lo);stroke-width:.5}
.w-top{fill:var(--brass-hi);opacity:.55}
.w-lbl{fill:var(--brass-lo);font-size:var(--t12);font-weight:800;text-anchor:middle;dominant-baseline:central}
:root[data-theme="dark"] .w-lbl{fill:#3b2a05}
.w-hit{fill:transparent;cursor:pointer}
.w-tray-hit{fill:transparent;cursor:grab}
.tray{fill:var(--tray);stroke:var(--tray-edge);stroke-width:.8}
.tray-t{fill:var(--text-2);font-size:var(--t12);font-weight:600;text-anchor:middle}
.ruler{fill:var(--ruler);stroke:var(--ruler-edge);stroke-width:.6}
.r-tick{stroke:var(--ruler-ink);stroke-width:.35}
.r-tick.mid{stroke-width:.45}.r-tick.maj{stroke-width:.6}
.r-num{fill:var(--ruler-ink);font-size:6px;font-weight:600;text-anchor:end;dominant-baseline:central;font-variant-numeric:tabular-nums}
.r-unit{fill:var(--ruler-ink);font-size:5px;font-weight:600;text-anchor:middle}
.pointer{stroke:var(--read);stroke-width:1;stroke-linecap:round}
.pointer-tip{fill:var(--read)}
.lens-bg{fill:var(--loupe-bg)}
.lens-ring{fill:none;stroke:var(--loupe-ring);stroke-width:1.6}
.lens-handle{stroke:var(--loupe-ring);stroke-width:4;stroke-linecap:round}
.lens-t{fill:var(--text-1);font-size:var(--t13);font-weight:800;text-anchor:middle;font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--stage);stroke-width:var(--h3,3px);stroke-linejoin:round}
.lens-cap{fill:var(--text-2);font-size:var(--t12);font-weight:600;text-anchor:middle}
.fa-body{stroke-width:2.6;fill:none}
.fa-up .fa-body{stroke:var(--force-2)}.fa-up .fa-head{fill:var(--force-2)}.fa-up .fa-t{fill:var(--force-2)}
.fa-dn .fa-body{stroke:var(--force)}.fa-dn .fa-head{fill:var(--force)}.fa-dn .fa-t{fill:var(--force)}
.fa-dot{stroke:var(--stage);stroke-width:1}
.fa-t{font-size:var(--t12);font-weight:800;paint-order:stroke;stroke:var(--stage);stroke-width:var(--h3,3px);stroke-linejoin:round;font-variant-numeric:tabular-nums}
.cap-s{fill:var(--text-2);font-size:var(--t12);font-weight:500}
.small .cap-s,.small .lens-cap{display:none}
.drop-zone{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2}

/* 측정·기록 칸 */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface-1)}
.ctl{display:grid;grid-template-columns:auto auto minmax(0,1fr);grid-template-areas:"spring w rec" "meter meter meter";gap:12px 24px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-1)}
.ctl-row{display:flex;align-items:center;gap:10px}
.ctl-row:first-child{grid-area:spring}
.ctl-row:nth-child(2){grid-area:w}
.lbl-note{font-weight:500;margin-left:4px}
.stepper{display:flex;align-items:center;gap:6px}
.icon-btn.sm{width:36px;height:36px;border:1px solid var(--line-2);background:var(--surface-1)}
.wcount{min-width:44px;text-align:center;font:800 18px/1 var(--font-ui);color:var(--text-1)}
.meter{grid-area:meter;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.meter .m{display:flex;flex-direction:column;gap:2px;padding:4px 16px 4px 0}
.meter .m+.m{padding-left:16px;border-left:1px solid var(--line-1)}
.meter .readout .v{font-size:30px}
.rec-row{grid-area:rec;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.rec-row .grow{min-width:160px;min-height:44px;font-size:15px}
.rec-hint{font:500 13px/1.4 var(--font-ui);color:var(--text-2);max-width:220px;text-align:right}
.data{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.tbl-wrap,.graph-wrap{min-height:0;display:flex;flex-direction:column;padding:12px 18px 14px}
.graph-wrap{border-left:1px solid var(--line-1)}
.sub-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;min-height:34px}
.cap{font:700 15px/1.3 var(--font-ui);color:var(--text-1)}
.seg.small button{min-height:28px;font-size:12px;padding:0 10px}
.tbl-scroll{flex:1;min-height:0}
table.rec{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.rec th{position:sticky;top:0;background:var(--surface-1);font:600 12px/1.3 var(--font-ui);color:var(--text-2);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line-2)}
table.rec th:first-child,table.rec td:first-child{text-align:left}
table.rec td{font:500 15px/1.3 var(--font-ui);color:var(--text-1);text-align:right;padding:7px 8px;border-bottom:1px solid var(--line-1)}
table.rec td.ext{font-weight:800}
table.rec tr.fresh td{animation:fresh .9s var(--ease-out)}
@keyframes fresh{0%{background:var(--accent-soft)}100%{background:transparent}}
.mk{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:1px}
.mk.A{border-radius:50%;background:var(--data-a)}.mk.B{background:var(--data-b)}
.empty-row td{color:var(--text-2)!important;font-size:13px!important;text-align:left!important}
#graph{width:100%;flex:1;min-height:0}
.g-grid{stroke:var(--line-1);stroke-width:1}
.g-axis{stroke:var(--line-2);stroke-width:1.2}
.g-t{fill:var(--text-2);font:500 12px var(--font-ui);font-variant-numeric:tabular-nums}
.g-title{fill:var(--text-1);font:600 12px var(--font-ui)}
.g-a{fill:var(--data-a);stroke:var(--surface-1);stroke-width:1.5}
.g-b{fill:var(--data-b);stroke:var(--surface-1);stroke-width:1.5}
.g-la{stroke:var(--data-a);stroke-width:1.6;stroke-dasharray:6 4;fill:none}
.g-lb{stroke:var(--data-b);stroke-width:1.6;stroke-dasharray:2 3;fill:none}
.g-now{fill:none;stroke:var(--text-1);stroke-width:1.4;stroke-dasharray:2 2}
.g-lab{font:700 12px var(--font-ui)}
.find{font:500 15px/1.55 var(--font-ui);color:var(--text-1);min-height:24px;margin-top:4px}

@media (max-width:1180px){
  .ctl{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"spring spring" "w rec" "meter meter"}
}
@media (max-width:860px){
  main.app{overflow:auto}
  .lab{height:auto;grid-template-columns:44% minmax(0,1fr);grid-template-rows:auto auto}
  .stage-wrap{position:relative;min-height:calc(44vw * 492 / 262);border-bottom:1px solid var(--line-1)}
  .panel{display:contents}
  .ctl{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-1)}
  .ctl-row{flex-direction:column;align-items:flex-start;gap:6px}
  .ctl-row .seg{width:100%;grid-auto-flow:row;grid-auto-columns:auto}
  .lbl-note{display:block;margin:0}
  .meter{grid-template-columns:minmax(0,1fr);gap:4px}
  .meter .m{padding:2px 0}
  .meter .m+.m{padding-left:0;border-left:0;border-top:1px solid var(--line-1);padding-top:4px}
  .meter .readout .v{font-size:24px}
  .rec-row{flex-direction:column;align-items:stretch;gap:6px}
  .rec-row .grow{min-width:0}
  .rec-hint{text-align:left;max-width:none;font-size:12px}
  .data{grid-column:1 / -1;grid-row:2;grid-template-columns:minmax(0,1fr);background:var(--surface-1)}
  .graph-wrap{border-left:0;border-top:1px solid var(--line-1)}
  #graph{flex:none;height:auto}
  .tbl-scroll{max-height:none}
  .stage-tools{top:6px;left:6px}
  .save-btn{width:44px;height:44px;padding:0;justify-content:center}
  .save-btn .save-l{display:none}
}

  if (!settled()) {
    const b = 2 * ZETA * Math.sqrt(P.k * m), n = Math.max(1, Math.ceil(dt * 600)), h = dt / n;
    for (let i = 0; i < n; i++) { const a = (S.n * W_N - P.k * dyn.y - b * dyn.v) / m; dyn.v += a * h; dyn.y += dyn.v * h; }
    if (settled()) { dyn.y = yEq; dyn.v = 0; }
    render();
  }
  const s = settled(); if (s !== wasSettled) { wasSettled = s; renderGraph(); syncPanel(); }
}

/* ── 끌기·누르기: 상자의 추 → 고리, 맨 아래 추 → 상자 ── */
let drag = null;
svg.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-tray],[data-hang]'); if (!t) return;
  e.preventDefault();
  const from = t.dataset.tray ? 'tray' : 'hang';
  if (from === 'tray' && S.n >= NMAX) return;
  drag = { from, x0: e.clientX, y0: e.clientY, moved: false, g: null, id: e.pointerId };
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 5) {
    drag.moved = true;
    if (drag.from === 'hang') { S.n--; render(); }                       // 맨 아래 추를 떼어 든다
    else { drag.took = true; }
  }
  if (drag.moved) {
    const p = SS.svgPoint(svg, e.clientX, e.clientY), gd = $('#gDrag'); gd.innerHTML = '';
    weightG(gd, p.x, p.y - 14, { style: 'opacity:.9' });
    const yb = Y_ZERO + lenMM() + S.n * PITCH, near = Math.hypot(p.x - X_AX, p.y - 14 - yb) < 48;
    if (near) el('rect', { x: X_AX - 17, y: yb - 2, width: 34, height: 38, rx: 4, class: 'drop-zone' }, gd);
    drag.near = near;
  }
});
function endDrag() {
  if (!drag) return;
  $('#gDrag').innerHTML = '';
  const d = drag; drag = null;
  if (!d.moved) { d.from === 'tray' ? setN(S.n + 1, '추를 걸었어요') : setN(S.n - 1, '추를 내렸어요'); return; }
  if (d.from === 'tray') { if (d.near) setN(S.n + 1, '추를 걸었어요'); else render(); }
  else if (d.near) { S.n++; save(); render(); }                       // 도로 걸었다
  else { save(); renderGraph(); announce(`추 ${S.n}개. 추를 내렸어요`); }
}
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);

/* ═════════ 원리 카드 · 도움말 ═════════ */
function theory() {
  const a = recs.filter(r => r.s === 'A' && r.n > 0);
  return `<article class="tcard"><h3>탄성력</h3>
    <figure><svg viewBox="0 0 300 110" role="img" aria-label="늘어난 용수철은 원래대로 돌아가려고 반대 방향으로 힘을 낸다">
      <rect width="300" height="110" style="fill:var(--stage)"/><rect x="10" y="20" width="10" height="70" style="fill:var(--rod-lo)"/>
      <path d="M20 55h10${Array.from({ length: 9 }, (_, i) => `l8 ${i % 2 ? 12 : -12}`).join('')}l8 0h12" style="fill:none;stroke:var(--spring-front);stroke-width:2.5;stroke-linejoin:round"/>
      <rect x="130" y="40" width="30" height="30" rx="3" style="fill:var(--brass)"/>
      <line x1="160" y1="55" x2="240" y2="55" style="stroke:var(--force);stroke-width:4"/><path d="M252 55 238 47v16Z" style="fill:var(--force)"/>
      <line x1="130" y1="80" x2="80" y2="80" style="stroke:var(--force-2);stroke-width:4"/><path d="M68 80 82 72v16Z" style="fill:var(--force-2)"/>
      <text x="200" y="40" style="fill:var(--text-1);font:700 13px var(--font-ui);text-anchor:middle">당기는 힘</text>
      <text x="100" y="102" style="fill:var(--text-1);font:700 13px var(--font-ui);text-anchor:middle">탄성력</text>
    </svg></figure>
    <p class="def">변형된 물체가 원래 모양으로 돌아가려는 힘을 탄성력이라고 해요.</p>
    <p>탄성력은 물체를 변형시킨 힘과 반대 방향으로 작용해요. 용수철에 매단 추가 멈춰 있을 때는 위로 작용하는 탄성력과 아래로 작용하는 추의 무게가 크기는 같고 방향은 반대예요(힘의 평형).</p>
    <p class="link">장면의 두 화살표를 보세요. 용수철이 출렁이는 동안에는 길이가 달라지다가, 멈추면 같은 길이가 돼요.</p></article>
  <article class="tcard"><h3>늘어난 길이는 무게에 비례해요</h3>
    <p class="def">용수철이 늘어난 길이는 매단 물체의 무게(용수철을 당기는 힘)에 비례해요.</p>
    <p>그래서 ‘늘어난 길이’ 그래프는 원점을 지나는 직선이 돼요. 같은 힘에 덜 늘어나는 용수철은 기울기가 작아요. 용수철을 너무 많이 늘이면 원래대로 돌아오지 않으니(탄성 한계) 이 실험은 추 5개까지만 걸어요.</p>
    <p class="link">${a.length >= 2 ? `기록한 A: ${a.map(r => `${f2(r.W)} N → ${f1(r.ext)} cm`).join(', ')}.` : '기록을 3개 이상 모은 뒤 그래프의 모양을 보세요.'}</p></article>
  <article class="tcard"><h3>질량과 무게는 달라요</h3>
    <p class="def">질량(g, kg)은 물체의 양, 무게(N)는 지구가 물체를 당기는 힘의 크기예요.</p>
    <p>지구에서 질량 1 kg인 물체의 무게는 약 9.8 N이에요. 그래서 100 g 추 한 개의 무게는 0.98 N이에요. 달에 가면 질량은 그대로지만 무게는 약 1/6로 줄어요.</p></article>`;
}
const HELP = {
  how: `<ol><li>오른쪽 아래 상자의 <b>추</b>를 누르거나 용수철 아래로 끌어 걸어요(＋ 단추로도 걸 수 있어요). 맨 아래 추를 누르면 내려요.</li>
    <li>용수철이 출렁이다 <b>멈추면</b> 지침이 가리키는 자의 눈금을 읽고 <b>기록하기</b>를 눌러요. 돋보기에 눈금이 3배로 보여요. 추 0개(처음 길이)부터 기록해요.</li>
    <li>기록표의 ‘늘어난 길이’와 그래프를 보고 추의 무게와의 관계를 찾아요. <b>용수철 B</b>로 바꿔 같은 실험을 하고 두 직선의 기울기를 비교해요.</li></ol>`,
  keys: '<kbd>+</kbd> 추 걸기 · <kbd>−</kbd> 추 내리기 · 기록하기 단추에 포커스 후 <kbd>Enter</kbd>',
  model: `<ul><li>추 한 개는 질량 100 g, 무게 0.98 N(지구에서 1 kg의 무게 9.8 N)으로 계산했어요.</li>
    <li>용수철 A는 추 한 개마다 2.0 cm, B는 1.0 cm 늘어나도록 정했어요(A 49 N/m, B 98 N/m). 추 5개까지는 탄성 한계 안이라 늘어난 길이가 무게에 비례해요.</li>
    <li>자의 0 눈금은 용수철 윗고리에 맞췄고, 지침이 가리키는 눈금이 용수철 길이예요. 자는 1 mm 단위로 읽어요.</li>
    <li>추를 걸면 용수철이 잠시 출렁이다 멈춰요(감쇠가 있는 진동). 멈춘 뒤에만 기록할 수 있어요.</li>
    <li>용수철 자체의 무게는 늘어나는 길이에 넣지 않았어요.</li></ul>`,
  source: '<p>2022 개정 중학교 과학 ‘힘의 작용’ 탐구 활동 ‘용수철의 탄성력 측정하기’와 [9과05-02] 중력, 탄성력, 마찰력, 부력을 이해하고, 각 힘의 특징을 크기와 방향으로 설명할 수 있다(해설: 질량과 무게를 구별). 이전 판(React 한 화면)의 기능(추 걸기·단위·그래프 두 가지)을 이어받아 다시 만들었어요.</p>',
  wipe: '기록표, 그래프, 용수철·추 상태',
};

/* ═════════ 이벤트 · 시작 ═════════ */
function capture() {
  const P = SPRINGS[S.sp], rows = recs.filter(r => r.s === S.sp).sort((a, b) => a.n - b.n);
  return { svg, flashEl: $('#stage'),
    cond: `${P.name} · 추 ${S.n}개(무게 ${f2(S.n * W_N)} N) · 처음 길이 ${f1(P.L0 / 10)} cm`,
    state: `${settled() ? `용수철 길이 ${f1(readCm())} cm · 늘어난 길이 ${f1(readCm() - P.L0 / 10)} cm` : '용수철이 출렁이는 중'}${rows.length ? ` · 기록(${S.sp}): ${rows.map(r => `${r.n}개 ${f1(r.ext)} cm`).join(', ')}` : ''}` };
}
function sizeText() {
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  pxu = Math.min(r.width / 262, r.height / 492);
  for (const n of [12, 13, 15]) svg.style.setProperty(`--t${n}`, `${(n / pxu).toFixed(2)}px`);
  svg.style.setProperty('--h3', `${(3 / pxu).toFixed(3)}px`);
  svg.classList.toggle('small', pxu < 1);
  buildRulerTicks(); render();
}
function bind() {
  $('#wMinus').innerHTML = icon('minus'); $('#wPlus').innerHTML = icon('plus');
  $('#recBtn').innerHTML = `${icon('record')}기록하기`;
  $('#undoBtn').innerHTML = `${icon('undo')}마지막 기록 지우기`;
  $('#wMinus').addEventListener('click', () => setN(S.n - 1, '추를 내렸어요'));
  $('#wPlus').addEventListener('click', () => setN(S.n + 1, '추를 걸었어요'));
  $('#recBtn').addEventListener('click', record);
  $('#undoBtn').addEventListener('click', () => { if (!recs.length) return; recs.pop(); save(); renderTable(); renderGraph(); syncPanel(); announce('마지막 기록을 지웠어요.'); });
  $('#springSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setSpring(b.dataset.s); });
  $('#ySeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.yMode = b.dataset.y; save(); syncPanel(); renderGraph(); });
}
buildStatic(); bind();
SS.init({
  id: 'spring-force', title: '용수철 탄성력 실험', file: '용수철탄성력실험', version: APP_VERSION, date: APP_DATE,
  help: HELP, theory, capture, onResize: sizeText,
  onKey: e => { if (e.key === '+' || e.key === '=') { e.preventDefault(); setN(S.n + 1, '추를 걸었어요'); } else if (e.key === '-' || e.key === '_') { e.preventDefault(); setN(S.n - 1, '추를 내렸어요'); } },
  onWipe: () => { S = { sp: 'A', n: 0, yMode: 'ext' }; recs = []; dyn.y = 0; dyn.v = 0; render(); renderTable(); renderGraph(); },
});
renderTable(); sizeText(); renderGraph();
SS.loop(step);
window.SpringLab = { setN, setSpring, record, step, state: () => ({ S, recs, dyn: { ...dyn }, settled: settled(), read: readCm() }) };

</script>
