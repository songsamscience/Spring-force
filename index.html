<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>용수철 탄성력 측정 실험 (훅의 법칙)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        /* 모바일에서 터치 지연 제거 */
        button { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 컴포넌트 ---
        const PlusIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const MinusIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const RotateCcwIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        );
        const InfoIcon = ({ size = 20, className }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        );
        const ArrowRightLeftIcon = ({ size = 20, className }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m16 3 4 4-4 4"></path><path d="M20 7H4"></path><path d="m8 21-4-4 4-4"></path><path d="M4 17h16"></path></svg>
        );
        const BarChartIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
        );

        // --- 메인 컴포넌트 ---
        const HookesLawExperiment = () => {
            const [weightCount, setWeightCount] = useState(0);
            const [isAnimating, setIsAnimating] = useState(false);
            const [unit, setUnit] = useState('g');
            const [graphMode, setGraphMode] = useState('default');

            const BASE_LENGTH = 10;
            const EXTENSION_PER_WEIGHT = 2;
            const MAX_WEIGHTS = 10;
            const G_PER_WEIGHT = 100;
            const N_PER_WEIGHT = 0.98;

            const currentLength = BASE_LENGTH + (weightCount * EXTENSION_PER_WEIGHT);
            
            const currentWeightValue = unit === 'g' 
                ? weightCount * G_PER_WEIGHT 
                : (weightCount * N_PER_WEIGHT).toFixed(2);
            
            const currentWeightLabel = unit === 'g' ? 'g' : 'N';
            const singleWeightLabel = unit === 'g' ? '100g' : '0.98N';

            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const addWeight = () => {
                if (weightCount < MAX_WEIGHTS) {
                    setWeightCount(prev => prev + 1);
                    triggerAnimation();
                }
            };

            const removeWeight = () => {
                if (weightCount > 0) {
                    setWeightCount(prev => prev - 1);
                    triggerAnimation();
                }
            };

            const resetExperiment = () => {
                setWeightCount(0);
                triggerAnimation();
            };

            const toggleUnit = () => {
                setUnit(prev => prev === 'g' ? 'N' : 'g');
            };

            const toggleGraphMode = () => {
                setGraphMode(prev => prev === 'default' ? 'force' : 'default');
            };

            const triggerAnimation = () => {
                setIsAnimating(true);
                setTimeout(() => setIsAnimating(false), 300);
            };

            const generateSpringPath = (height) => {
                const coils = 10;
                const width = 40;
                const startX = 50;
                
                let path = `M ${startX} 0 `;
                path += `L ${startX} 10 `;
                
                let currentY = 10;
                const coilHeight = (height - 20) / coils;

                for (let i = 0; i < coils; i++) {
                    currentY += coilHeight;
                    const x = i % 2 === 0 ? startX + width/2 : startX - width/2;
                    path += `L ${x} ${currentY - coilHeight/2} `;
                    path += `L ${startX} ${currentY} `;
                }

                path += `L ${startX} ${height} `;
                return path;
            };

            const cmToPx = (cm) => cm * 15;
            const springPixelHeight = cmToPx(currentLength);

            // Chart.js 업데이트 로직
            useEffect(() => {
                const ctx = chartRef.current.getContext('2d');

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                let config = {};

                if (graphMode === 'default') {
                    // 모드 1: 전체 길이(X) vs 추의 개수(Y)
                    const dataPoints = [];
                    for(let i = 0; i <= weightCount; i++) {
                        dataPoints.push({
                            x: BASE_LENGTH + (i * EXTENSION_PER_WEIGHT),
                            y: i 
                        });
                    }

                    config = {
                        type: 'line',
                        data: {
                            datasets: [{
                                label: '추의 개수',
                                data: dataPoints,
                                borderColor: '#3b82f6',
                                backgroundColor: '#3b82f6',
                                borderWidth: 3,
                                pointBackgroundColor: '#3b82f6',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                pointHoverRadius: 8,
                                pointHitRadius: 15,
                                tension: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    type: 'linear',
                                    title: { display: true, text: '용수철 전체 길이 (cm)' },
                                    min: 0,
                                    max: 32,
                                    ticks: { stepSize: 2 },
                                    grid: { display: true, color: '#f1f5f9' }
                                },
                                y: {
                                    type: 'linear',
                                    title: { display: true, text: '추의 개수 (개)' },
                                    min: 0,
                                    max: MAX_WEIGHTS,
                                    ticks: { stepSize: 1 },
                                    grid: { display: true, color: '#f1f5f9' }
                                }
                            },
                            plugins: {
                                tooltip: { callbacks: { label: (c) => `길이: ${c.parsed.x}cm, 개수: ${c.parsed.y}개` } },
                                legend: { display: false }
                            },
                            animation: { duration: 400 }
                        }
                    };
                } else {
                    // 모드 2: 늘어난 길이(X) vs 탄성력(Y)
                    const dataPoints = [];
                    for(let i = 0; i <= weightCount; i++) {
                        dataPoints.push({
                            x: i * EXTENSION_PER_WEIGHT, 
                            y: i * N_PER_WEIGHT 
                        });
                    }

                    config = {
                        type: 'line',
                        data: {
                            datasets: [{
                                label: '탄성력',
                                data: dataPoints,
                                borderColor: '#ef4444',
                                backgroundColor: '#ef4444',
                                borderWidth: 3,
                                pointBackgroundColor: '#ef4444',
                                pointBorderColor: '#fff',
                                pointBorderWidth: 2,
                                pointRadius: 5,
                                pointHoverRadius: 8,
                                pointHitRadius: 15,
                                tension: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    type: 'linear',
                                    title: { display: true, text: '늘어난 길이 (cm)' },
                                    min: 0,
                                    max: 20, 
                                    ticks: { stepSize: 2 },
                                    grid: { display: true, color: '#f1f5f9' }
                                },
                                y: {
                                    type: 'linear',
                                    title: { display: true, text: '탄성력 (N)' },
                                    min: 0,
                                    max: 10,
                                    grid: { display: true, color: '#f1f5f9' }
                                }
                            },
                            plugins: {
                                tooltip: { callbacks: { label: (c) => `늘어난 길이: ${c.parsed.x}cm, 힘: ${c.parsed.y.toFixed(2)}N` } },
                                legend: { display: false }
                            },
                            animation: { duration: 400 }
                        }
                    };
                }

                chartInstance.current = new Chart(ctx, config);

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [weightCount, graphMode]);

            return (
                <div className="min-h-screen flex flex-col p-3 md:p-6 font-sans text-slate-800 bg-slate-50">
                    <header className="mb-4 md:mb-6 text-center flex-none">
                        <h1 className="text-2xl md:text-3xl font-bold text-blue-700 mb-2">용수철 탄성력 실험</h1>
                        <p className="text-sm md:text-base text-slate-600">추의 개수를 늘리면 용수철의 길이가 일정하게 늘어납니다.</p>
                    </header>

                    <div className="flex-grow w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-8">
                        
                        {/* 왼쪽: 실험 장치 (컨트롤러 통합됨) */}
                        <div className="bg-white rounded-xl shadow-lg p-4 flex flex-col items-center relative min-h-[500px] lg:min-h-[600px] overflow-hidden">
                            <h2 className="text-lg font-semibold mb-4 self-start flex items-center gap-2">
                                <span className="w-2 h-6 bg-blue-500 rounded-sm"></span>
                                실험 장치
                            </h2>
                            
                            {/* 컨트롤러 (천장 옆 상단 배치) */}
                            <div className="absolute top-4 right-4 flex flex-col gap-2 z-30 bg-white/80 backdrop-blur-sm p-2 rounded-xl shadow-sm border border-slate-100">
                                <div className="flex gap-2 mb-1">
                                    <button
                                        onClick={addWeight}
                                        disabled={weightCount >= MAX_WEIGHTS}
                                        className="w-10 h-10 flex items-center justify-center bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 disabled:opacity-50 active:scale-95 transition-all"
                                        title="추 추가"
                                    >
                                        <PlusIcon size={24} />
                                    </button>
                                    <button
                                        onClick={removeWeight}
                                        disabled={weightCount === 0}
                                        className="w-10 h-10 flex items-center justify-center bg-white border border-slate-200 text-slate-700 rounded-lg shadow-sm hover:bg-red-50 hover:text-red-600 disabled:opacity-50 active:scale-95 transition-all"
                                        title="추 제거"
                                    >
                                        <MinusIcon size={24} />
                                    </button>
                                </div>
                                
                                <button
                                    onClick={resetExperiment}
                                    className="w-full py-1.5 bg-slate-100 text-slate-500 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-colors text-xs font-medium flex items-center justify-center gap-1"
                                >
                                    <RotateCcwIcon size={14} />
                                    초기화
                                </button>
                                
                                <button
                                    onClick={toggleUnit}
                                    className="w-full py-1.5 bg-slate-50 border border-slate-100 text-slate-600 hover:bg-slate-100 rounded-lg text-[10px] font-medium transition-colors flex items-center justify-center"
                                >
                                    <span className="mr-1">단위:</span>
                                    <span className={unit === 'g' ? 'text-blue-600 font-bold' : 'text-slate-400'}>g</span>
                                    <ArrowRightLeftIcon size={10} className="mx-1 text-slate-400" />
                                    <span className={unit === 'N' ? 'text-blue-600 font-bold' : 'text-slate-400'}>N</span>
                                </button>
                                
                                <div className="mt-1 text-center bg-slate-50 rounded-lg py-1 border border-slate-100">
                                     <span className="text-[10px] text-slate-400 block">현재 무게</span>
                                     <span className="text-sm font-bold text-slate-700">{currentWeightValue}</span>
                                     <span className="text-[10px] text-slate-500 ml-0.5">{unit}</span>
                                </div>
                            </div>

                            {/* 천장 고정대 */}
                            <div className="w-40 md:w-48 h-3 md:h-4 bg-slate-700 rounded-full mb-0 z-10 shadow-md mx-auto mt-2"></div>

                            <div className="flex w-full justify-center relative flex-grow overflow-hidden">
                                
                                {/* 자 (Ruler) - 텍스트 잘림 방지를 위해 left-12로 더 넉넉하게 조정 */}
                                <div className="absolute left-12 md:left-16 top-0 h-full border-r-2 border-slate-300 pr-1 md:pr-2 py-2 select-none z-0">
                                    {Array.from({ length: 8 }, (_, i) => (
                                        <div key={i} className="absolute right-0 flex items-center" style={{ top: cmToPx(i * 5) + 10 }}>
                                            <span className="text-[10px] md:text-xs text-slate-400 mr-1 md:mr-2 whitespace-nowrap">{i * 5}cm</span>
                                            <div className="w-2 md:w-3 h-px bg-slate-300"></div>
                                        </div>
                                    ))}
                                </div>

                                {/* 초기 길이 표시선 */}
                                <div 
                                    className="absolute left-0 w-full flex items-center pointer-events-none z-0"
                                    style={{ top: cmToPx(BASE_LENGTH) + 10 }}
                                >
                                    <div className="w-full border-t-2 border-red-300 border-dashed opacity-60"></div>
                                    <span className="absolute right-2 md:right-auto md:left-24 bg-red-50 text-red-500 text-[10px] md:text-xs px-2 py-0.5 rounded-full border border-red-200 font-medium whitespace-nowrap">
                                        초기 길이 ({BASE_LENGTH}cm)
                                    </span>
                                </div>

                                {/* 용수철 및 추 컨테이너 */}
                                <div className="relative flex flex-col items-center z-10" style={{ width: '100px' }}>
                                    <svg width="100" height={springPixelHeight} className={`transition-all duration-500 ease-out ${isAnimating ? 'scale-x-95' : 'scale-x-100'}`}>
                                        <path
                                            d={generateSpringPath(springPixelHeight)}
                                            fill="none"
                                            stroke="#3b82f6"
                                            strokeWidth="4"
                                            strokeLinecap="round"
                                            strokeLinejoin="round"
                                            className="drop-shadow-sm"
                                        />
                                    </svg>

                                    {/* 추 (Weights) */}
                                    <div className="flex flex-col items-center transition-all duration-500 ease-out pb-10">
                                        <div className="w-4 h-4 rounded-full border-4 border-slate-400 -mt-2 bg-transparent z-10"></div>
                                        
                                        {weightCount === 0 ? (
                                            <div className="text-sm text-slate-400 absolute top-8 w-32 text-center bg-white/90 py-1 px-2 rounded-full border border-slate-100 shadow-sm z-20">
                                                추를 걸어보세요 👇
                                            </div>
                                        ) : (
                                            Array.from({ length: weightCount }).map((_, idx) => (
                                                <div 
                                                    key={idx}
                                                    className="w-14 md:w-16 h-7 md:h-8 bg-gradient-to-r from-amber-500 to-amber-600 border-2 border-amber-700 rounded-md shadow-md flex items-center justify-center text-[9px] md:text-[10px] font-bold text-white mb-0.5"
                                                >
                                                    {singleWeightLabel}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 오른쪽: 그래프 및 데이터 */}
                        <div className="flex flex-col gap-4 md:gap-6">
                            
                            {/* 그래프 카드 (Chart.js) */}
                            <div className="bg-white rounded-xl shadow-lg p-4 md:p-6 flex-1 min-h-[350px] md:min-h-[400px] flex flex-col">
                                <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                                    <h2 className="text-lg md:text-xl font-semibold flex items-center gap-2">
                                        <span className={`w-2 h-6 rounded-sm ${graphMode === 'default' ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                        {graphMode === 'default' ? '결과 그래프 (전체 길이 vs 개수)' : '결과 그래프 (늘어난 길이 vs 힘)'}
                                    </h2>
                                    <button 
                                        onClick={toggleGraphMode}
                                        className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium flex items-center gap-1.5 transition-colors border border-slate-200"
                                    >
                                        <BarChartIcon size={14} />
                                        {graphMode === 'default' ? '탄성력(N) 그래프 보기' : '기본 그래프 보기'}
                                    </button>
                                </div>

                                <div className="w-full flex-grow min-h-[250px] md:min-h-[350px] relative">
                                    <canvas ref={chartRef}></canvas>
                                </div>
                                
                                <div className={`mt-4 p-3 rounded-lg text-xs md:text-sm flex items-start gap-2 ${graphMode === 'default' ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                                    <InfoIcon size={16} className="mt-0.5 shrink-0" />
                                    {graphMode === 'default' ? (
                                        <p><strong>전체 길이</strong>(x축)가 길어질수록 매달린 <strong>추의 개수</strong>(y축)도 비례하여 증가합니다.</p>
                                    ) : (
                                        <p><strong>늘어난 길이</strong>(x축)가 증가함에 따라 작용하는 <strong>탄성력</strong>(y축)이 비례하여 커집니다. (기울기 = k)</p>
                                    )}
                                </div>

                                <div className="mt-4 md:mt-6 pt-4 border-t border-slate-100 hidden md:block">
                                    <h3 className="text-md font-bold text-slate-700 mb-3 text-center">💡 훅의 법칙 공식</h3>
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                                        <div className="text-2xl font-serif font-bold text-blue-800 mb-2">
                                            F = -kx
                                        </div>
                                        <div className="text-xs text-slate-500 mt-2">
                                            <span className="inline-block bg-white px-2 py-1 rounded border border-slate-200 shadow-sm text-red-500 font-bold mr-1">-</span>
                                            부호의 의미: 변위(늘어난 방향)와 반대 방향으로 작용하는 <strong>복원력</strong>
                                        </div>
                                        <div className="flex justify-center gap-4 text-xs text-slate-500 mt-3">
                                            <span>F: 탄성력(복원력)</span>
                                            <span>k: 용수철 상수</span>
                                            <span>x: 늘어난 길이</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 데이터 테이블 */}
                            <div className="bg-white rounded-xl shadow-lg p-4 md:p-6">
                                <h2 className="text-lg md:text-xl font-semibold mb-4 flex items-center gap-2">
                                    <span className="w-2 h-6 bg-purple-500 rounded-sm"></span>
                                    측정 데이터
                                </h2>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase bg-slate-50">
                                            <tr>
                                                <th className="px-3 md:px-4 py-2 md:py-3 rounded-l-lg whitespace-nowrap">항목</th>
                                                <th className="px-3 md:px-4 py-2 md:py-3 rounded-r-lg text-right whitespace-nowrap">값</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            <tr>
                                                <td className="px-3 md:px-4 py-2 md:py-3 font-medium text-slate-700">추의 개수</td>
                                                <td className="px-3 md:px-4 py-2 md:py-3 text-right font-mono text-blue-600">{weightCount} 개</td>
                                            </tr>
                                            <tr>
                                                <td className="px-3 md:px-4 py-2 md:py-3 font-medium text-slate-700">
                                                    작용하는 힘 (탄성력)
                                                </td>
                                                <td className="px-3 md:px-4 py-2 md:py-3 text-right font-mono font-bold text-slate-800">
                                                    {(weightCount * N_PER_WEIGHT).toFixed(2)} N
                                                </td>
                                            </tr>
                                            <tr className={graphMode === 'default' ? "bg-blue-50/50" : ""}>
                                                <td className={`px-3 md:px-4 py-2 md:py-3 font-medium ${graphMode === 'default' ? 'text-blue-800 font-bold' : 'text-slate-700'}`}>전체 길이</td>
                                                <td className={`px-3 md:px-4 py-2 md:py-3 text-right font-mono ${graphMode === 'default' ? 'text-blue-700 font-bold' : 'text-slate-600'}`}>{currentLength} cm</td>
                                            </tr>
                                            <tr className={graphMode === 'force' ? "bg-red-50/50" : ""}>
                                                <td className={`px-3 md:px-4 py-2 md:py-3 font-medium ${graphMode === 'force' ? 'text-red-600 font-bold' : 'text-slate-700'}`}>늘어난 길이 (변위 x)</td>
                                                <td className={`px-3 md:px-4 py-2 md:py-3 text-right font-mono ${graphMode === 'force' ? 'text-red-500 font-bold text-lg' : 'text-red-500'}`}>+{currentLength - BASE_LENGTH} cm</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <footer className="mt-8 mb-4 text-center text-slate-400 text-xs md:text-sm font-medium flex-none">
                        ⓒ 2025. 송쌤과학 All rights reserved.
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HookesLawExperiment />);
    </script>
</body>
</html>
